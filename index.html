<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Match</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="hero">
      <p class="eyebrow"><span class="signal" aria-hidden="true"></span> COSMIC ARCADE / MISSION 01</p>
      <h1>Memory <span>Match</span></h1>
      <p class="subtitle">Explore the galaxy. Find every matching pair.</p>
    </header>

    <section class="game-panel" aria-label="Memory Match game">
      <div class="panel-heading"><span>MISSION CONTROL</span><span>✦ &nbsp; DECK ONLINE</span></div>
      <p id="status" role="status" aria-live="polite"></p>
      <div class="toolbar">
        <div id="difficulty" role="group" aria-label="Difficulty">
          <button id="easy" type="button" aria-pressed="true">Easy <span>6 pairs</span></button>
          <button id="hard" type="button" aria-pressed="false">Hard <span>10 pairs</span></button>
        </div>
        <button id="new-game" type="button">↻ &nbsp; New game</button>
      </div>
      <div id="table" aria-label="Cards"></div>
      <p class="hint">Flip two cards to reveal the cosmos. Match them all to win.</p>
    </section>
  </main>

  <!-- Order matters: the contract first, then deck, rules, and screen. -->
  <script src="state.js"></script>
  <script src="deck.js"></script>
  <script src="game.js"></script>
  <script src="ui.js"></script>
</body>
</html>
